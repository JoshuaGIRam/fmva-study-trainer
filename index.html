<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<title>FMVA Study Trainer</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#667085;--line:#e4e7ec;--accent:#155eef;--accent2:#eef4ff;--good:#12b76a;--bad:#f04438;--shadow:0 8px 30px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px max(16px,calc((100vw - 1100px)/2))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:-.02em}.brand span{color:var(--accent)}.pill{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--accent2);color:var(--accent);font-weight:700}.wrap{max-width:1100px;margin:auto;padding:22px 16px 90px}.hero{background:linear-gradient(135deg,#0b1220,#173b7a);color:#fff;border-radius:22px;padding:26px;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#dbe5ff;max-width:720px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.span8{grid-column:span 8}.span4{grid-column:span 4}.span6{grid-column:span 6}.span12{grid-column:span 12}.metric{font-size:30px;font-weight:800}.muted{color:var(--muted)}.progress{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:10px}.btn{padding:11px 14px;border-radius:11px;background:var(--accent);color:#fff;font-weight:700}.btn.secondary{background:#eef2f6;color:#344054}.btn.ghost{background:transparent;color:var(--accent);padding:8px}.nav{display:flex;gap:8px;overflow:auto;margin:16px 0}.nav button{white-space:nowrap;padding:9px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);color:#344054}.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.module{padding:13px;border:1px solid var(--line);border-radius:12px}.module strong{display:block;margin-bottom:6px}.question{font-size:21px;font-weight:750;line-height:1.35}.answers{display:grid;gap:10px;margin-top:18px}.answer{padding:13px 14px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px}.answer:hover{border-color:#98a2b3}.answer.correct{border-color:var(--good);background:#ecfdf3}.answer.wrong{border-color:var(--bad);background:#fef3f2}.explain{margin-top:14px;padding:14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}.tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:5px 8px;border-radius:999px;background:#f2f4f7;color:#475467;margin-right:6px}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800}.calc input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.calc label{font-size:13px;color:var(--muted)}.result{font-size:24px;font-weight:800;margin-top:10px}.list{margin:0;padding-left:20px}.small{font-size:13px}.source{font-size:12px;color:var(--muted);line-height:1.5}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:760px){.span8,.span4,.span6{grid-column:span 12}.hero h1{font-size:25px}.wrap{padding:14px 12px 80px}.card{padding:15px}.top{padding:10px 12px}.question{font-size:19px}.grid{gap:10px}}
</style>
</head>
<body><div id="app" class="app"></div><script src="app.js"></script></body>
</html>
